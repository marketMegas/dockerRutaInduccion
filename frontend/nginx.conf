server {
    listen 80;
    server_name megas.com.co www.megas.com.co;

    # Ruta para que Certbot pueda validar el certificado
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redirección automática a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Configuración para el tráfico HTTPS (debes crearla una vez tengas el certificado)
server {
    listen 443 ssl;
    server_name megas.com.co www.megas.com.co;

    # Aquí irían tus certificados generados por certbot
    # ssl_certificate /etc/letsencrypt/live/megas.com.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/megas.com.co/privkey.pem;

    location /rutainduccion {
        alias /usr/share/nginx/html/rutainduccion;
        try_files $uri $uri/ /rutainduccion/index.html;
    }

    # Proxy para el backend (para evitar el error Failed to fetch)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}