# ============================================================
#  nginx del HOST del VPS (NO es un contenedor).
#
#  Instalacion:
#    sudo cp filesParaDeploy/nginx-host.conf /etc/nginx/sites-available/rutainduccion
#    sudo ln -s /etc/nginx/sites-available/rutainduccion /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d megas.com.co -d www.megas.com.co
#
#  Este nginx TERMINA el TLS y reenvia en claro al contenedor frontend
#  (127.0.0.1:5137). El X-Forwarded-Proto: https es OBLIGATORIO: el
#  settings.py de Django confia en el (SECURE_PROXY_SSL_HEADER) para
#  generar URLs https:// en correos y certificados y para la
#  comprobacion de Referer de CSRF. Sin esa cabecera, todo lo que sale
#  por correo lleva http://.
# ============================================================

server {
    listen 80;
    server_name megas.com.co www.megas.com.co;

    # Ruta para que certbot valide el certificado
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Todo lo demas, a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name megas.com.co www.megas.com.co;

    # certbot --nginx rellena/ajusta estas dos lineas con los certificados
    # reales. Tambien pueden crearse a mano tras correr certbot.
    ssl_certificate     /etc/letsencrypt/live/megas.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/megas.com.co/privkey.pem;

    # Igual que el nginx del contenedor frontend: los certificados PDF y
    # las subidas futuras pasan por aca.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5137;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Fijo en https: ESTE servidor siempre habla TLS con el cliente.
        proxy_set_header X-Forwarded-Proto https;
        # Acorde al --timeout 120 de gunicorn: generar/notificar un
        # certificado con SMTP lento no debe morir en el proxy.
        proxy_read_timeout 120s;
    }
}
