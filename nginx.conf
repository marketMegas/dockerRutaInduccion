# El TLS lo termina el nginx del host, asi que este contenedor siempre recibe
# http. Con $scheme a secas se sobreescribiria el X-Forwarded-Proto que manda el
# host y Django creeria que cada peticion es http (URLs http:// en los correos y
# los certificados, y la comprobacion de Referer de CSRF desactivada).
# Se reenvia lo que venga; si no viene nada, se usa el de esta conexion.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost megas.com.co www.megas.com.co;

    # El directorio base general
    root /usr/share/nginx/html;

    # Emite los Location como rutas relativas en los redirect, para no perder
    # el puerto (sin esto / redirigia a http://localhost/ en vez de :5137/)
    absolute_redirect off;

    # Cabeceras para el proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    client_max_body_size 20M;

    # 1. La raiz manda a la app (si no, nginx muestra su pagina de bienvenida)
    location = / {
        return 302 /rutainduccion/;
    }

    # 2. La ruta anterior, para que los enlaces viejos no mueran
    location = /rutadeexpertos {
        return 301 /rutainduccion/;
    }

    # 3. SPA de React (Vite compila con base '/rutainduccion/')
    location /rutainduccion {
        alias /usr/share/nginx/html/rutainduccion;
        try_files $uri $uri/ /rutainduccion/index.html;
    }

    # 4. API del backend Django
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # 5. Admin de Django (si no se proxea, el try_files devuelve el index equivocado)
    location /admin/ {
        proxy_pass http://backend:8000;
    }

    # 6. Estaticos de Django (los sirve WhiteNoise, ya comprimidos)
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # 7. Archivos subidos: certificados PDF. Los sirve nginx desde el volumen,
    #    no Django (whitenoise no soporta prefijos en su middleware de Django).
    location /media/ {
        alias /usr/share/nginx/html/media/;
    }

    # 8. Cualquier otra ruta tambien va a la app
    location / {
        return 302 /rutainduccion$request_uri;
    }
}
